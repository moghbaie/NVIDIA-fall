[project]
name = "shockamp"
version = "0.1.0"
description = "State-dependent shock amplification: leadership news, pre-event stress and abnormal returns"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "scipy>=1.12", "statsmodels>=0.14",
  "matplotlib>=3.8", "pyyaml>=6", "requests>=2.31", "yfinance>=0.2.50", "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pandas-stubs", "types-PyYAML", "types-requests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shockamp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs downloaded data / network"]
