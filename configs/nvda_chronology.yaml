  - id: E2
    first_public_date: 2026-11-12
    time_known: false
    description: Board accepted Huang's resignation on 2026-11-11 (8-K Item 5.02); announced 2026-11-12; CFO Colette Kress interim CEO; Harvey Jones appointed Chair. No reason stated in filing.
    sources:
      - https://nvidianews.nvidia.com/news/nvidia-announces-ceo-transition/
      - https://www.sec.gov/Archives/edgar/data/1045810/000104581026000082/nvda-20261111.htm
