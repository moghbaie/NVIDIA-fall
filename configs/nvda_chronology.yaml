    description: >
      US midterm elections; reporting links the following chip selloff partly to post-election
      worries about data-center spending and AI regulation (attributed, secondary sources).
  - date: 2026-11-04
    description: NVDA AR -4.9% (exploratory); AMD results (Nov 3 after close) react in this session.
  - date: 2026-11-05
    description: >
      Broad semiconductor selloff (SOX about -9% to -12% depending on source; ex-NVDA basket -14.6%,
      SPY -4.5%, VIX 28.2). Reported drivers: Qualcomm weak guidance (Nov 4 after close), Arm
      results, memory shortage, doubts about AI capex financing, post-election worries. No source
      found linking it to the Oct 29 NVIDIA report (searched 2026-11-13; absence of evidence, not
      proof). Provisional reading: stress at E1 is pre-existing, not caused by the leadership news.
  - date: 2026-11-17
    description: NVIDIA Q3 FY2027 earnings, ~13:20 PT. Windows beyond this are confounded.
