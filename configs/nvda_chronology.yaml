# NVIDIA leadership-news disclosure sequence. Verified facts only; unverified fields marked.
# Allegations are attributed to their sources and are not treated as established facts.
events:
  - id: E0
    first_public_date: 2026-10-29
    time_known: false
    description: NYT report that a Megaspeed-linked businesswoman (Alice Huang) was allegedly recruited by China's MSS and had a close relationship with Jensen Huang; NVIDIA spokesperson pushes back the same day.
    sources:
      - https://www.cnbc.com/2026/10/29/nvidia-jensen-huang-chinese-intelligence-asset.html
    verified: partial   # NYT original timestamp not yet verified
  - id: E1
    first_public_date: 2026-11-08   # Sunday -> first session 2026-11-09
    time_known: false
    description: NVIDIA board opens independent investigation (committee of independent directors + outside counsel); Huang memo to employees admits extramarital affair.
    sources:
      - https://nvidianews.nvidia.com/news/statement-from-nvidia-board-of-directors
      - https://www.cnbc.com/2026/11/08/nvidia-jensen-huang-investigation-china-spy.html
      - https://www.cnn.com/2026/11/08/business/nvidia-investigation-ceo-jensen-huang
    verified: yes
  - id: E1b
    first_public_date: 2026-11-10
    time_known: false
    description: Statement from the independent members of the NVIDIA board (content not yet reviewed).
    sources: [https://nvidianews.nvidia.com/]
    verified: title_only
  - id: E2
    first_public_date: 2026-11-12
    time_known: false
    description: Board accepted Huang's resignation on 2026-11-11 (8-K Item 5.02); announced 2026-11-12; CFO Colette Kress interim CEO; Harvey Jones appointed Chair. No reason stated in filing.
    sources:
      - https://nvidianews.nvidia.com/news/nvidia-announces-ceo-transition/
      - https://www.sec.gov/Archives/edgar/data/1045810/000104581026000082/nvda-20261111.htm
    verified: yes   # 8-K accepted 08:52 ET (pre-market); CNBC reported the board decision the prior evening, so earliest public time may be 2026-11-11 after close. Either way the event session is 2026-11-12. Step 1(f): TipRanks 06:40 ET on 2026-11-12 already reported possible removal and AMD/AVGO premarket gains, so first public time is before 08:52 ET; event session unchanged.
# Step 1(a)/(b), 2026-11-13. Release times = SEC EDGAR 8-K acceptance (America/New_York);
# reaction session via the 16:00 rule. Causes from secondary sources are attributed, not established.
