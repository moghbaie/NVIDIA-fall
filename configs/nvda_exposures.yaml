# Step 1(d): NVIDIA's disclosed exposures to the AI-infrastructure buildout, as typed records.
# Amounts are NOT additive across records: a purchase commitment, a contingent guarantee (maximum
# gross exposure) and a recognized liability have different economic meanings.
# measure: contractual_commitment = undiscounted future payments NVIDIA has agreed to make
#          maximum_gross_exposure  = worst case if every trigger fires; not an expected loss
#          carrying_amount         = recognized on the balance sheet
#          notional                = contract notional, not a loss estimate
#          not_quantified          = disclosed risk without an amount
# `mechanism` states how a deployment bottleneck COULD transmit to NVIDIA (hypothesis, not a finding).
